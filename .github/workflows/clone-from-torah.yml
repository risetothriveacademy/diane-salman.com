name: One-time clean clone from Torah Mathews site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  clone-source:
    if: github.event.head_commit.message == 'TRIGGER CLONE FROM TORAH'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Diane Salman target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Torah Mathews production main branch
        run: |
          git clone --depth 1 --branch main https://github.com/risetothriveacademy/torah-mathews-website.git "$RUNNER_TEMP/torah-source"

      - name: Replace target working tree with clean source copy
        run: |
          rsync -a --delete --exclude='.git' "$RUNNER_TEMP/torah-source/" ./

      - name: Commit clean clone into Diane Salman repository
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clone Torah Mathews production main as Diane Salman starting point"
          git push origin main
