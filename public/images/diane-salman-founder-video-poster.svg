<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Founder Message — Diane Salman, MBA</title>
  <desc id="desc">Branded video poster for Diane Salman, founder of Rise to Thrive Hub LLC and Transforming Pain Into Power.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#0097B2"/>
      <stop offset="1" stop-color="#DB910F"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="110" r="220" fill="#0097B2" opacity=".08"/>
  <circle cx="160" cy="650" r="260" fill="#DB910F" opacity=".08"/>
  <rect x="96" y="88" width="1088" height="544" rx="28" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".8"/>
  <text x="640" y="260" text-anchor="middle" fill="#67D9E8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="5">A MESSAGE FROM THE FOUNDER</text>
  <text x="640" y="350" text-anchor="middle" fill="#FAF5EA" font-family="Georgia, serif" font-size="58" font-weight="700">Diane Salman, MBA</text>
  <text x="640" y="410" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28">Founder • Trauma Recovery Educator • Speaker • Author • Consultant</text>
  <circle cx="640" cy="515" r="54" fill="#DB910F"/>
  <polygon points="625,483 625,547 675,515" fill="#020617"/>
</svg>